name: Release

# Push a tag like v0.2.0 (matching package.json "version") to build a DRAFT
# release with the signed and notarized macOS builds and the Linux builds.
# Windows is signed locally with Azure Trusted Signing (it needs the local
# Connect-AzAccount session): run scripts\release-win.ps1 -Tag v0.2.0 to build,
# verify and upload the Windows files, then publish the draft.
#
# Repository secrets used by the macOS job:
#   MAC_CERT_P12_BASE64   Developer ID Application certificate (.p12), base64
#   MAC_CERT_PASSWORD     its password
#   APPLE_ID              the Apple ID used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD
#   APPLE_TEAM_ID

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.2.0)
        required: true

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require the signing secrets
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -z "$P12" ] || [ -z "$APPLE_ID" ]; then
            echo "::error::Add the MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID secrets to sign and notarize the macOS build."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Package, sign and notarize
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish never
      - name: Verify the signature and notarization
        run: |
          app=$(find dist -maxdepth 2 -name '*.app' | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  draft:
    needs: [mac, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "Faction Wars Pack Editor $TAG" \
            --notes "Windows builds are added after local signing (scripts/release-win.ps1). macOS builds are signed and notarized." \
            artifacts/*
